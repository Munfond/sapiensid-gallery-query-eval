name: Evaluation logic tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test labels and ranking metrics
        run: python -m unittest -v test_evaluate.py
      - name: Check CLI
        run: python evaluate.py --help
